<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مطعم ومزرعة سمكنا – عين القنية، جرش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3EA;--sf:#FFFFFF;--ink:#14281E;--mut:#587061;--ln:#D6DECF;--deep:#12331F;--lake:#4E8C73;--leaf:#6FA05A;--wood:#D8913A;--roof:#C4623F;--foam:#E4EDDC;--on:#F1F6EC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A12;--sf:#12281B;--ink:#E8F1E4;--mut:#9DB8A6;--ln:#24412F;--foam:#162F21}}
:root[data-theme="dark"]{--bg:#0B1A12;--sf:#12281B;--ink:#E8F1E4;--mut:#9DB8A6;--ln:#24412F;--foam:#162F21}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.9 'Cairo',Tahoma,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--deep);z-index:41}
h1,h2,h3,.logo{font-family:'Cairo',sans-serif;font-weight:800;line-height:1.4;margin:0}
a{color:inherit}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--wood);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.prog{position:fixed;top:env(safe-area-inset-top,0px);inset-inline-start:0;height:3px;width:0;background:var(--wood);z-index:50}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--deep);color:var(--on)}
.bar{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.logo{font-size:28px;color:var(--wood);text-decoration:none}
nav{display:flex;gap:4px;align-items:center}
nav a{text-decoration:none;padding:4px 14px;border-radius:99px;font-size:15.5px;transition:.25s}
nav a:hover,nav a.on{background:rgba(255,255,255,.12);color:var(--wood)}
.tools{display:flex;gap:8px}
.ic{background:none;border:1px solid rgba(255,255,255,.3);color:var(--on);border-radius:99px;min-width:38px;height:38px;padding:0 12px;font-weight:600}
#menu{display:none}
@media(max-width:760px){#menu{display:block}
nav{position:absolute;top:62px;inset-inline:0;background:var(--deep);flex-direction:column;align-items:stretch;padding:0 20px;max-height:0;overflow:hidden;opacity:0;transition:.3s;pointer-events:none}
nav.open{max-height:360px;opacity:1;pointer-events:auto;padding-bottom:16px}nav a{font-size:18px}}
.hero{position:relative;overflow:hidden;color:var(--on);padding:90px 0 140px;min-height:84vh;display:flex;align-items:center;background:var(--deep)}
.hbg{position:absolute;inset:-4%;background-size:cover;background-position:center;animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.1) translateX(1.5%)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(18,51,31,.92) 25%,rgba(18,51,31,.45))}
.fish{position:absolute;z-index:1;width:150px;inset-inline-end:9%;top:34%;transition:transform .25s ease-out;transform:translate(calc(var(--mx,0)*34px),calc(var(--my,0)*26px));animation:swim 5s ease-in-out infinite}
@keyframes swim{50%{margin-top:-18px}}
.hero .wrap{position:relative;z-index:2;width:100%}
.ht{max-width:540px}
.hero h1{font-size:clamp(70px,14vw,130px);color:#fff;line-height:1.2;animation:rise 1s both}
@keyframes rise{from{opacity:0;transform:translateY(40px);filter:blur(8px)}}
.lead{font-size:clamp(18px,2.6vw,22px);color:var(--foam);margin:6px 0 28px;animation:rise 1s .3s both}
.btns{display:flex;flex-wrap:wrap;gap:12px;animation:rise 1s .5s both}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 26px;border-radius:99px;font-weight:600;text-decoration:none;border:2px solid transparent;background:none;color:inherit;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.gold{background:var(--wood);color:#2A1700}.ghost{border-color:rgba(241,246,236,.55)}
.wave{position:absolute;z-index:3;bottom:-1px;left:0;width:200%;height:70px;animation:wv 16s linear infinite}
@keyframes wv{to{transform:translateX(-50%)}}
section{padding:78px 0}
h2{font-size:clamp(30px,5vw,46px);margin-bottom:8px}
.sub{color:var(--mut);max-width:620px;margin:0 0 34px}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}.rv.d1{transition-delay:.12s}
.story{display:grid;grid-template-columns:1fr 1fr;gap:46px;align-items:center}
.pic{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/4.4;background:var(--lake)}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s}
.pic:hover img{transform:scale(1.07)}
.pic q{position:absolute;inset-inline:0;bottom:0;padding:70px 24px 22px;color:#fff;font-weight:600;font-size:19px;line-height:1.8;quotes:none;background:linear-gradient(transparent,rgba(10,30,18,.88))}
.facts{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px}
.facts button{width:100%;text-align:start;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:12px 18px;color:var(--ink);transition:.25s}
.facts button b{display:flex;justify-content:space-between;font-size:18px}
.facts button b::after{content:"+";color:var(--roof);font-size:22px;transition:.3s}
.facts button[aria-expanded=true]{border-color:var(--lake)}.facts button[aria-expanded=true] b::after{transform:rotate(45deg)}
.facts p{margin:0;max-height:0;overflow:hidden;color:var(--mut);transition:max-height .35s,margin .35s}
.facts button[aria-expanded=true] p{max-height:120px;margin-top:4px}
.band{background:var(--foam)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);padding:6px 20px;border-radius:99px;transition:.25s}
.tab[aria-selected=true]{background:var(--deep);border-color:var(--deep);color:#fff;transform:scale(1.05)}
.panel{display:none;background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:28px;border-inline-start:6px solid var(--roof);animation:pn .5s}
.panel.on{display:block}@keyframes pn{from{opacity:0;transform:translateY(14px)}}
.panel h3{font-size:28px;color:var(--lake)}.panel p{margin:4px 0 0;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{position:relative;aspect-ratio:4/5;border:0;padding:0;border-radius:22px;overflow:hidden;background:var(--lake);color:#fff;transition:transform .35s}
.tile:hover{transform:translateY(-6px) scale(1.02)}.tile.hide{display:none}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s}.tile:hover img{transform:scale(1.08)}
.tile cap{display:block;position:absolute;inset-inline:0;bottom:0;padding:34px 16px 12px;text-align:start;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.vid{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;padding:20px;background:linear-gradient(150deg,var(--roof),#8E3F27);text-decoration:none}
.vid .play{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;animation:pl 2s infinite}
.vid .play::after{content:"";border-inline-start:18px solid var(--roof);border-block:11px solid transparent;transform:scaleX(-1);margin-inline-end:-4px}
[dir=ltr] .vid .play::after{transform:none;margin-inline-end:0;margin-inline-start:4px}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 0 0 24px transparent}}
.lb{position:fixed;inset:0;background:rgba(4,14,8,.93);z-index:100;display:none;place-items:center;padding:20px}
.lb.on{display:grid}
.lb .box{max-width:min(860px,100%);border-radius:18px;overflow:hidden;animation:pn .35s;text-align:center;color:#fff}
.lb .box img{width:100%;max-height:78vh;object-fit:contain;display:block}
.lb .box p{margin:8px 0 0}
.lb button{position:absolute;background:rgba(255,255,255,.15);border:0;color:#fff;width:46px;height:46px;border-radius:50%;font-size:22px}
.lb .x{top:calc(env(safe-area-inset-top,0px) + 14px);right:14px}.lb .a{top:50%;left:12px}.lb .b{top:50%;right:12px}
.visit{display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:26px}
.card h3{font-size:25px;margin-bottom:10px}
.row{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.row dt{color:var(--mut);min-width:80px}.row dd{margin:0}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
label{display:block;font-size:15px;margin:10px 0 2px;color:var(--mut)}
input,select{width:100%;padding:9px 14px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus{border-color:var(--lake);outline:0}
form .btn{margin-top:16px;width:100%;justify-content:center}
footer{background:var(--deep);color:var(--foam);padding:36px 0 44px;text-align:center;font-size:15px}
footer .logo{font-size:34px;display:block;color:var(--wood)}
.tt{position:fixed;inset-inline-start:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:30;width:50px;height:50px;border-radius:50%;border:0;background:var(--wood);color:#2A1700;font-size:20px;opacity:0;transform:scale(.6);transition:.3s;pointer-events:none}
.tt.show{opacity:1;transform:none;pointer-events:auto}
@media(max-width:760px){.story,.visit{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.fish{width:90px;top:14%}section{padding:56px 0}.pic{aspect-ratio:4/3.4}}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
